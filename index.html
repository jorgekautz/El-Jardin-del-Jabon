<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F2F0E8" />

    <title>El Jardín del Jabón · Recetas de jabones artesanales</title>
    <meta
      name="description"
      content="Biblioteca digital de recetas de jabones artesanales: ingredientes, propiedades, preparación paso a paso, lista de compras y administración de recetas."
    />
    <meta name="keywords" content="jabones artesanales, glicerina, recetas, jabón natural, aceites esenciales, cosmética artesanal" />
    <meta name="author" content="El Jardín del Jabón" />
    <!--
      Añade aquí <link rel="canonical" href="https://TU-DOMINIO/" /> al publicar:
      una URL relativa "/" no aporta nada al rastreador y rompe el empaquetado de Vite.
    -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="El Jardín del Jabón" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="El Jardín del Jabón · Recetas de jabones artesanales" />
    <meta
      property="og:description"
      content="Descubre el arte de crear tus propios jabones naturales: recetas, ingredientes y utensilios documentados."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231E2620'/%3E%3Cpath d='M16 6c5 3 8 6.5 8 11a8 8 0 0 1-16 0c0-4.5 3-8 8-11Z' fill='none' stroke='%239DB79A' stroke-width='1.8'/%3E%3Cpath d='M16 27V13M16 18l-3.4-3M16 20.5l3.4-3' stroke='%239DB79A' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "El Jardín del Jabón",
        "description": "Biblioteca digital de recetas de jabones artesanales",
        "inLanguage": "es",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "/recetas?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      El Jardín del Jabón necesita JavaScript para navegar por las recetas. En la carpeta
      <code>docs/</code> del proyecto encontrarás el listado de recetas en texto.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
